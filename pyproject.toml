[project]
name = "langgraph-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "EmadSoheili" }
]
requires-python = ">=3.11"
dependencies = [
    "black>=26.10.0",
    "google-genai>=2.29.0",
    "isort>=9.0.2",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.14",
    "langsmith>=0.14.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langgraph-course = "langgraph_course:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
